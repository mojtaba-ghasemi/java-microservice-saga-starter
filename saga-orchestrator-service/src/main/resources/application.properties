spring.application.name=saga-orchestrator-service

#JWT Configs
jwtKey=a6b9c7d8e4f2a1b3c5d7e9f0a2b4c6d8e0f1a3b5c7d9e1f3a5b7c9d1e3f5a7b9
jwtExpiration=86400


spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration


# Server Configuration
server.port=8080
application.version=v1

spring.data.mongodb.uri=@spring.data.mongodb.uri@

# RabbitMQ Connection Configuration
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# RabbitMQ Exchange and Queue Configuration
rabbitmq.exchange=jms.saga.exchange
rabbitmq.queue=saga.orchestrator.queue

# RabbitMQ Routing Keys for Different Services
rabbitmq.identityManagement.routing.key=identity.management.routing.key
rabbitmq.orderManagement.routing.key=order.management.routing.key
rabbitmq.paymentService.routing.key=payment.service.routing.key
rabbitmq.notificationService.routing.key=notification.service.routing.key

# Or if you prefer a simpler naming convention:
# rabbitmq.routing.key.identity=identity.service
# rabbitmq.routing.key.order=order.service
# rabbitmq.routing.key.payment=payment.service

# Security (optional - for development)
spring.security.user.name=admin
spring.security.user.password=admin123

# Logging
logging.level.org.springframework.amqp=DEBUG
logging.level.io.github.mojtaba.microservice.starter=DEBUG

# Swagger UI paths - allow public access
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Optional: Customize Swagger UI
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.operationsSorter=alpha

#Queue properties for report-query
rabbitmq.backoffice.orchestration.process.routingKey=rabbitmq.backoffice.orchestration.reportQuery.process.routingKey
rabbitmq.backoffice.orchestration.process.queueName=rabbitmq.backoffice.orchestration.reportQuery.process.queueName
rabbitmq.backoffice.orchestration.process.exchange=rabbitmq.backoffice.orchestration.reportQuery.process.exchange
rabbitmq.backoffice.orchestration.sequence.routingKey=rabbitmq.backoffice.orchestration.reportQuery.sequence.routingKey
rabbitmq.backoffice.orchestration.sequence.queueName=rabbitmq.backoffice.orchestration.reportQuery.sequence.queueName
rabbitmq.backoffice.orchestration.sequence.exchange=rabbitmq.backoffice.orchestration.reportQuery.sequence.exchange
#End of Queue properties for report-query

